name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.7.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zip gettext python3

      - name: Set version in metadata.json
        run: |
          python3 - <<'EOF'
          import json, os
          version = os.environ["RELEASE_VERSION"]
          with open("metadata.json") as f:
              meta = json.load(f)
          meta["KPlugin"]["Version"] = version
          with open("metadata.json", "w") as f:
              json.dump(meta, f, indent=4, ensure_ascii=False)
              f.write("\n")
          EOF
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Build plasmoid
        run: bash make-plasmoid.sh "org.kde.cppserver-v${{ inputs.version }}.plasmoid"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: org.kde.cppserver-v${{ inputs.version }}.plasmoid
